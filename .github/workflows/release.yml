name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic release
    runs-on: ubuntu-latest
    if: github.repository == 'gisce/github-agent-bridge' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore release branch at workflow SHA
        run: git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Check workflow SHA is still current
        id: release_head
        run: |
          set -o pipefail
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "$remote_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale release run for ${GITHUB_SHA}; ${GITHUB_REF_NAME} is now at ${remote_sha}."
          fi

      - name: Set up Python
        if: steps.release_head.outputs.current == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Set up Node
        if: steps.release_head.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install package with test dependencies
        if: steps.release_head.outputs.current == 'true'
        run: python -m pip install -e '.[test]'
      - name: Install dashboard dependencies
        if: steps.release_head.outputs.current == 'true'
        run: npm ci
        working-directory: dashboard
      - name: Run dashboard tests
        if: steps.release_head.outputs.current == 'true'
        run: npm test
        working-directory: dashboard
      - name: Build dashboard
        if: steps.release_head.outputs.current == 'true'
        run: npm run build
        working-directory: dashboard

      - name: Run tests before release
        if: steps.release_head.outputs.current == 'true'
        run: pytest -q

      - name: Recheck workflow SHA before release
        id: pre_release_head
        if: steps.release_head.outputs.current == 'true'
        run: |
          set -o pipefail
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "$remote_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping release because ${GITHUB_REF_NAME} advanced to ${remote_sha} during validation."
          fi

      - name: Semantic version release
        id: release
        if: steps.pre_release_head.outputs.current == 'true'
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com

      - name: Upload distributions to GitHub Release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Upload distribution artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: distribution-artifacts
          path: dist
          if-no-files-found: error
